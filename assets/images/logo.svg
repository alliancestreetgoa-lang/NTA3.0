<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NTA Group emblem">
  <defs>
    <linearGradient id="ntaGreen" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d5638"/>
      <stop offset="1" stop-color="#0f2c1d"/>
    </linearGradient>
    <linearGradient id="ntaGold" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0c27e"/>
      <stop offset="1" stop-color="#c8a45c"/>
    </linearGradient>
  </defs>

  <!-- rounded square -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="url(#ntaGreen)"/>
  <rect x="2.75" y="2.75" width="114.5" height="114.5" rx="25.25" stroke="url(#ntaGold)" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- globe horizon arc (global trade) -->
  <path d="M22 78 a38 38 0 0 1 76 0" stroke="url(#ntaGold)" stroke-width="2" stroke-opacity="0.55" fill="none"/>
  <path d="M30 78 h60 M60 40 v38 M40 55 a40 40 0 0 0 40 0" stroke="url(#ntaGold)" stroke-width="1.4" stroke-opacity="0.35" fill="none"/>

  <!-- ascending growth bars (trade / agriculture) -->
  <g fill="url(#ntaGold)">
    <rect x="44" y="74" width="6" height="14" rx="2"/>
    <rect x="57" y="66" width="6" height="22" rx="2"/>
    <rect x="70" y="56" width="6" height="32" rx="2"/>
  </g>

  <!-- leaf accent atop the tallest bar (natural) -->
  <path d="M73 56 c0 -9 6 -14 12 -16 c0 8 -4 15 -12 16 Z" fill="url(#ntaGold)"/>

  <!-- monogram -->
  <text x="60" y="44" text-anchor="middle" font-family="Marcellus, Georgia, serif" font-size="26" letter-spacing="1.5" fill="url(#ntaGold)">NTA</text>
</svg>
